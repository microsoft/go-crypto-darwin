on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    types: [labeled]
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".github/workflows/build-swift.yml"
      - "gen-swift-bindings.sh"

name: Build Swift
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name ==
      'generate-bindings'
    permissions:
      contents: write
      actions: write
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.ref || '' }}

      - name: Build Swift
        run: bash gen-swift-bindings.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          go-download-base-url: "https://aka.ms/golang/release/latest"

      - name: Run go generate
        run: go generate ./...
        env:
          MS_GO_NOSYSTEMCRYPTO: "1" # Disable systemcrypto to avoid duplicate-symbol/object-file linker errors during go generate

      - name: Commit and Push Changes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --global user.name "GitHub Actions"

          git add internal/cryptokit/CryptoKit*.syso
          git add internal/cryptokit/zcryptokit_swift_*.go
          git add internal/cryptokit/xcodebuild_version.txt
          git add internal/cryptokit/zcryptokit.h

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Regenerate bindings"
          git push
          echo "Triggering test workflow..."
          gh workflow run test.yml --ref "$HEAD_REF"

      - name: Generate GitHub App token
        if: github.event_name != 'pull_request'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23ctjZVuLU9yK8RQ6s
          private-key: ${{ secrets.GHMANAGER_GITHUBAPP_MICROSOFT_CRYPTO_UPDATER_FOR_GO_PRIVATE_KEY_PEM }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        if: github.event_name != 'pull_request'
        env:
          BRANCH: autogen/update-cryptokit-obj
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config --local user.name "microsoft-crypto-updater-for-go[bot]"
          git config --local user.email "336483805+microsoft-crypto-updater-for-go[bot]@users.noreply.github.com"

          git add internal/cryptokit/CryptoKit*.syso
          git add internal/cryptokit/zcryptokit_swift_*.go
          git add internal/cryptokit/xcodebuild_version.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update CryptoKit Object files"

          # Keep one automation branch and update its open PR on later runs.
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git branch --force "$BRANCH" HEAD
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force-with-lease origin "$BRANCH"

          PR_URL=$(gh pr list \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json url \
            --jq '.[0].url')
          if [ -n "$PR_URL" ]; then
            echo "Updated pull request: $PR_URL"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Update CryptoKit Object files" \
            --body "Update generated CryptoKit object files and bindings.

          Automated by the Build Swift workflow, run [#${GITHUB_RUN_NUMBER}](${RUN_URL})."
