on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    types: [labeled]
  push:
    branches:
      - main
    paths:
      - "**/*.swift"
      - ".github/workflows/build-swift.yml"
      - "gen-swift-bindings.sh"

name: Build Swift
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.label.name ==
      'generate-bindings'
    permissions:
      contents: write
      actions: write
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.ref || '' }}

      - name: Build Swift
        run: bash gen-swift-bindings.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          go-download-base-url: "https://aka.ms/golang/release/latest"

      - name: Run go generate
        run: go generate ./...
        env:
          MS_GO_NOSYSTEMCRYPTO: "1" # Disable systemcrypto to avoid duplicate-symbol/object-file linker errors during go generate

      - name: Commit and Push Changes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config --local user.email "action@github.com"
          git config --global user.name "GitHub Actions"

          git add internal/cryptokit/CryptoKit*.syso
          git add internal/cryptokit/zcryptokit_swift_*.go
          git add internal/cryptokit/xcodebuild_version.txt
          git add internal/cryptokit/zcryptokit.h

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Regenerate bindings"
          git push
          echo "Triggering test workflow..."
          gh workflow run test.yml --ref "$HEAD_REF"

      - name: Generate GitHub App token
        if: github.event_name != 'pull_request'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23ctjZVuLU9yK8RQ6s
          private-key: ${{ secrets.GHMANAGER_GITHUBAPP_MICROSOFT_CRYPTO_UPDATER_FOR_GO_PRIVATE_KEY_PEM }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create pull request
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: Update CryptoKit Object files
          committer: microsoft-crypto-updater-for-go[bot] <336483805+microsoft-crypto-updater-for-go[bot]@users.noreply.github.com>
          author: microsoft-crypto-updater-for-go[bot] <336483805+microsoft-crypto-updater-for-go[bot]@users.noreply.github.com>
          branch: autogen/update-cryptokit-obj
          delete-branch: true
          title: Update CryptoKit Object files
          body: |
            Update generated CryptoKit object files and bindings.

            Automated by the Build Swift workflow, run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          add-paths: |
            internal/cryptokit/CryptoKit*.syso
            internal/cryptokit/zcryptokit_swift_*.go
            internal/cryptokit/xcodebuild_version.txt
